name: Update RSS feedon:  schedule:    # GitHub scheduler re-registration: run twice per hour, away from peak times.    - cron: "13,43 * * * *"      timezone: "Asia/Tokyo"  workflow_dispatch:  push:    branches: [main]permissions:  contents: writejobs:  update:    runs-on: ubuntu-latest    steps:      - uses: actions/checkout@v6      - uses: actions/setup-python@v6        with:          python-version: "3.x"      - run: python generate_feed.py      - name: Commit updated feed        run: |          git config user.name "github-actions[bot]"          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"          git add docs/feed.xml          git diff --cached --quiet || git commit -m "Update RSS feed"          git push
